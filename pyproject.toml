[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
description = "A Python client library for connecting securely to your Google Cloud AlloyDB instances."
name = "google-cloud-alloydb-connector"
authors = [{ name = "Google LLC", email = "googleapis-packages@google.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    # Should be one of:
    # "Development Status :: 3 - Alpha"
    # "Development Status :: 4 - Beta"
    # "Development Status :: 5 - Production/Stable"
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiofiles",
    "cryptography>=46.0.5",
    "requests",
    "google-auth",
    "protobuf",
    "google-cloud-alloydb",
    "google-api-core",
    # The exporter below requires ~=1.30 of both; state the floor here too so
    # it survives that requirement being relaxed.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    # Built-in telemetry subclasses this exporter and overrides private hooks
    # (_batch_write, _get_metric_descriptor) to write system metrics with
    # CreateServiceTimeSeries. The package has never cut a stable release, so
    # the a0 floor is what makes pip consider it at all.
    #
    # No upper bound: built-in telemetry is on by default, so a cap would make
    # the connector uninstallable alongside an application that uses the
    # exporter directly. Both hooks and every attribute in _EXPORTER_ATTRS are
    # unchanged from 1.11 through 1.15, and telemetry.py re-checks them at
    # runtime, falling back to NullTelemetryProvider with a logged warning if
    # a release renames them -- which TestExporterCompatibilityGuard turns
    # into a failing build, since CI resolves to the newest release.
    #
    # 1.13 deprecates the exporter in favor of OTLP, which cannot write a
    # Google-owned metric prefix at all, so there is nothing to migrate to for
    # system metrics; telemetry.py absorbs that warning where it subclasses.
    "opentelemetry-exporter-gcp-monitoring>=1.11.0a0",
    "google-cloud-monitoring>=2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/alloydb-python-connector"
Repository = "https://github.com/GoogleCloudPlatform/alloydb-python-connector.git"
Issues = "https://github.com/GoogleCloudPlatform/alloydb-python-connector/issues"
Changelog = "https://github.com/GoogleCloudPlatform/alloydb-python-connector/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pg8000 = ["pg8000>=1.31.1"]
asyncpg = ["asyncpg>=0.31.0"]
psycopg = ["psycopg>=3.1.0"]

[dependency-groups]
test = [
    "asyncpg>=0.31.0",
    "mock>=5.2.0",
    "pg8000>=1.31.5",
    "psycopg2-binary>=2.9.11",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "SQLAlchemy[asyncio]>=2.0.48",
    "aioresponses>=0.7.8",
    "coverage",
]
lint = [
    "ruff==0.17.0",
    "mypy",
    "types-aiofiles",
    "types-requests",
    "build",
    "twine",
    {include-group = "test"},
]

[tool.setuptools.dynamic]
version = { attr = "google.cloud.alloydbconnector.version.__version__" }

[tool.setuptools.package-data]
"google.cloud.alloydbconnector" = ["py.typed"]

[tool.setuptools.packages.find]
# Only include packages under the 'google' namespace. Do not include tests,
# benchmarks, etc.
include = ["google*"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "google/api/*",
    "google/cloud/alloydb_connectors_v1/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401", # Any is needed for pass-through **kwargs
    "E501",   # line too long — enforced by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["google"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = ['docs/*']

[tool.pytest.ini_options]
asyncio_mode = "auto"
